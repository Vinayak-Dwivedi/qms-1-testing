# Netlify configuration — iLeads QMS (UI demo with seeded demo data)
#
# Deploys the Next.js web UI. The background worker (transcription/audit) is NOT
# part of this deploy — Netlify is serverless. The UI renders pre-seeded demo
# data (prisma/seed.ts).
#
# IMPORTANT — two kinds of env vars:
#   * BUILD-time: the placeholders in [build.environment] below let Prisma and
#     `next build` validate the schema/config WITHOUT a real database. They are
#     NOT secrets and are NOT used at runtime (Netlify build.environment values
#     do not reach Functions).
#   * RUNTIME: set the REAL values in the Netlify UI (Site configuration →
#     Environment variables) so the deployed Functions use them:
#       DATABASE_URL   real Neon connection string
#       APP_SECRET     64-byte random secret
#       APP_PASSWORD   demo login password
#       APP_BASE_URL   https://<your-site>.netlify.app
#
# The database is migrated + seeded ONCE, out-of-band (not on every build) —
# see docs/netlify-demo.md.

[build]
  command = "npx prisma generate && npx next build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"
  # --- BUILD-ONLY placeholders (not secrets, not used at runtime) ---
  DATABASE_URL = "postgresql://user:pass@localhost:5432/placeholder?schema=public"
  APP_SECRET = "netlify-build-only-placeholder-not-a-real-secret"

# Netlify's official Next.js runtime — turns the app into serverless functions.
[[plugins]]
  package = "@netlify/plugin-nextjs"
