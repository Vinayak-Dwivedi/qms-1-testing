# Netlify configuration — iLeads QMS (UI demo with seeded demo data)
#
# Deploys the Next.js web UI. The background worker (transcription/audit) is NOT
# part of this deploy — Netlify is serverless. The UI renders pre-seeded demo
# data (prisma/seed.ts).
#
# Required env vars — set the REAL values in the Netlify UI
# (Site configuration → Environment variables) with scope = "All scopes" so
# they're available at BUILD time (migrate + seed + config validation) AND at
# runtime (the deployed Functions):
#   DATABASE_URL   real Neon connection string
#   APP_SECRET     64-byte random secret
#   APP_PASSWORD   demo login password (the seed hashes this into the login)
#   APP_BASE_URL   https://<your-site>.netlify.app

[build]
  # generate client → apply migrations → seed demo data → build the app.
  command = "npx prisma generate && npx prisma migrate deploy && npx tsx prisma/seed.ts && npx next build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

# Netlify's official Next.js runtime — turns the app into serverless functions.
[[plugins]]
  package = "@netlify/plugin-nextjs"
